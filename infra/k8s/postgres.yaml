apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: privacy-act-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              value: app
            - name: POSTGRES_DB
              value: privacyrag
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "privacyrag"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: privacy-act-rag
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
