apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: privacy-act-rag
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: privacy-act-rag:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
